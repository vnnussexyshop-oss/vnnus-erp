<section>
  <div class="page-header">
    <div>
      <h2>📦 Produtos</h2>
      <p>Produtos reais carregados da sua planilha.</p>
    </div>
    <button class="btn-primary">+ Novo Produto</button>
  </div>

  <div id="produtoStatus" style="color:var(--muted);margin-bottom:15px;">Conectando à API...</div>

  <div class="toolbar">
    <input id="produtoBusca" class="input input-grow" type="text" placeholder="Pesquisar produto ou GTIN...">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>GTIN</th>
          <th>Produto</th>
          <th>Categoria</th>
          <th>Preço</th>
          <th>Estoque</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="produtoTabela">
        <tr><td colspan="7">Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</section>
