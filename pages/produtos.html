<section><div class="page-header"><div><h2>📦 Produtos</h2><p>Cadastro e gerenciamento dos produtos VNNUS.</p></div><button class="btn-primary">+ Novo Produto</button></div><div class="toolbar"><input id="produtoBusca" class="input input-grow" placeholder="Pesquisar produto ou GTIN..."></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>GTIN</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Status</th></tr></thead><tbody id="produtoTabela"></tbody></table></div></section>
<script>window.init_produtos=async()=>{const p=await VNNUS_API.produtos(),t=produtoTabela,m=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});const r=l=>t.innerHTML=l.map(x=>`<tr><td>${x.id}</td><td>${x.gtin}</td><td>${x.produto}</td><td>${x.categoria}</td><td>${m(x.preco)}</td><td>${x.estoque}</td><td><span class="status-badge ${x.status==="OK"?"status-ok":"status-danger"}">${x.status}</span></td></tr>`).join("");r(p);produtoBusca.oninput=()=>{const q=produtoBusca.value.toLowerCase();r(p.filter(x=>x.produto.toLowerCase().includes(q)||x.gtin.includes(q)))}}</script>
