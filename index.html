<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta
    name="theme-color"
    content="#0f0f0f">

  <title>
    VNNUS ERP 2.1
  </title>

  <link
    rel="manifest"
    href="manifest.webmanifest">

  <link
    rel="icon"
    href="assets/icons/icon-192.png">

  <link
    rel="apple-touch-icon"
    href="assets/icons/icon-192.png">

  <link
    rel="stylesheet"
    href="css/app.css">

</head>


<body>

  <div class="app-shell">

    <aside
      class="sidebar"
      id="sidebar">

      <div class="brand">

        <div class="brand-main">
          VNNUS
        </div>

        <div class="brand-sub">
          ERP 2.1
        </div>

      </div>


      <nav class="menu">

        <button
          class="menu-item active"
          data-page="dashboard">
          🏠 <span>Dashboard</span>
        </button>

        <button
          class="menu-item"
          data-page="produtos">
          📦 <span>Produtos</span>
        </button>

        <button
          class="menu-item"
          data-page="scanner">
          📷 <span>Scanner</span>
        </button>

        <button
          class="menu-item"
          data-page="estoque">
          📊 <span>Estoque</span>
        </button>

        <button
          class="menu-item"
          data-page="pdv">
          🛒 <span>PDV</span>
        </button>

        <button
          class="menu-item"
          data-page="vendas">
          🧾 <span>Vendas</span>
        </button>

        <button
          class="menu-item"
          data-page="clientes">
          👥 <span>Clientes</span>
        </button>

       <button
  class="menu-item"
  data-page="financeiro">
  💰 <span>Financeiro</span>
</button>

<button
  class="menu-item"
  data-page="despesas">
  💳 <span>Despesas</span>
</button>

<button
  class="menu-item"
  data-page="configuracoes">
  ⚙️ <span>Configurações</span>
</button>

      </nav>


      <div class="sidebar-footer">

        <span class="online-dot"></span>

        <small>
          VNNUS • Online
        </small>

      </div>

    </aside>


    <div class="main-area">

      <header class="topbar">

        <button
          class="mobile-menu-btn"
          id="mobileMenuBtn">
          ☰
        </button>


        <div>

          <h1 id="pageTitle">
            Dashboard
          </h1>

          <p id="pageSubtitle">
            Visão geral da operação
          </p>

        </div>


        <div class="topbar-actions">

          <button
            class="icon-btn"
            id="installBtn"
            hidden
            title="Instalar">
            ↓
          </button>

          <button
            class="icon-btn"
            id="refreshBtn"
            title="Atualizar">
            ↻
          </button>

          <div class="user-chip">

            <div class="user-avatar">
              A
            </div>

            <div>

              <strong>
                Administrador
              </strong>

              <small>
                VNNUS
              </small>

            </div>

          </div>

        </div>

      </header>


      <main
        id="appContent"
        class="content">

        <div class="loading-card">
          Carregando...
        </div>

      </main>

    </div>

  </div>


  <div
    class="sidebar-overlay"
    id="sidebarOverlay">
  </div>


  <!-- JAVASCRIPTS -->

  <script src="js/config.js"></script>
 <script src="js/api.js?v=2.2"></script>
  <script src="js/router.js"></script>
 <script src="js/dashboard.js?v=2.4"></script>
  <script src="js/produtos.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/estoque.js"></script>
  <script src="js/pdv.js"></script>
  <script src="js/vendas.js"></script>
<script src="js/clientes.js"></script>
<script src="js/financeiro.js"></script>
<script src="js/despesas.js"></script>
<script src="js/configuracoes.js"></script>
<script src="js/app.js"></script>

</body>

</html>
